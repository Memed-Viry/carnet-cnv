name: Test calendrier
on:
  push:
    paths: ['.github/workflows/t.yml']
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - run: npm install --no-audit --no-fund
      - run: |
          mkdir -p ci; DRY=1 node scripts/calendar.mjs > ci/cal.txt 2>&1 || true
          git config user.name carnet-bot; git config user.email carnet-bot@users.noreply.github.com
          git add ci; git commit -m "Test calendrier"; git pull --rebase; git push
