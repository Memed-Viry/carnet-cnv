name: Test agendas
on:
  push:
    paths: ['.github/workflows/t.yml']
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p ci
          curl -sL -A "Mozilla/5.0" "https://www.parisaquatique.fr/events" -o ci/pa.html
          curl -sL -A "Mozilla/5.0" "https://bbnatation.fr/agenda/liste/" -o ci/bb.html
          curl -sL -A "Mozilla/5.0" "https://bbnatation.fr/agenda/liste/page/2/" -o ci/bb2.html
          git config user.name carnet-bot; git config user.email carnet-bot@users.noreply.github.com
          git add ci; git commit -m "Test agendas 2"; git pull --rebase; git push
# 2
