name: Test agendas
on:
  push:
    paths: ['.github/workflows/t.yml']
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p ci
          for u in "https://bbnatation.fr/agenda/liste/" "https://www.parisaquatique.fr/events" "https://www.lif-natation.fr/dossiers_sportifs_category/maitres/org-competitions-maitres/"; do
            curl -sL -A "Mozilla/5.0" "$u" -o /tmp/p.html -w "%{http_code} %{size_download} $u\n"
            sed -e 's/<[^>]*>/ /g' /tmp/p.html | tr -s ' \n' | grep -i -m 12 "ma[iî]tre"
            echo ----
          done > ci/agendas.txt 2>&1
          git config user.name carnet-bot; git config user.email carnet-bot@users.noreply.github.com
          git add ci; git commit -m "Test agendas"; git pull --rebase; git push
