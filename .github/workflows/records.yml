name: Records de France Maîtres (chaque semaine)
on:
  schedule:
    - cron: '13 6 * * 2'
  workflow_dispatch:
  push:
    paths: ['scripts/records.mjs', '.github/workflows/records.yml']
permissions:
  contents: write
concurrency:
  group: donnees
  cancel-in-progress: false
jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - run: npm install --no-audit --no-fund
      - run: node scripts/records.mjs
      - name: Publier si changement
        run: |
          if git diff --quiet; then echo "rien de nouveau"; exit 0; fi
          git config user.name "carnet-bot"; git config user.email "carnet-bot@users.noreply.github.com"
          git commit -am "Auto records de France $(TZ=Europe/Paris date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done; exit 1
