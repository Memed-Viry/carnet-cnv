name: Résultats en direct (jours de compétition)
on:
  schedule:
    - cron: '7 6-20 * * *'
  workflow_dispatch:
  push:
    paths: ['.github/workflows/live.yml']
permissions:
  contents: write
concurrency:
  group: direct
  cancel-in-progress: false
jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - run: npm install --no-audit --no-fund
      - name: Relevé toutes les 6 minutes pendant 1 heure
        run: |
          git config user.name "carnet-bot"; git config user.email "carnet-bot@users.noreply.github.com"
          end=$(( $(date +%s) + 3300 ))
          while [ $(date +%s) -lt $end ]; do
            git pull -q --rebase -X theirs || true
            set +e; node scripts/live.mjs; rc=$?; set -e
            if [ $rc -eq 3 ]; then echo "pas de compétition aujourd'hui"; exit 0; fi
            if ! git diff --quiet; then
              git commit -qam "Auto live $(TZ=Europe/Paris date '+%Y-%m-%d %H:%M')"
              for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; sleep 5; done
            fi
            sleep 360
          done
