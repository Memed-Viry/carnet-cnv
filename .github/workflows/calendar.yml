name: Calendrier (lundi et jeudi)
on:
  schedule:
    - cron: '53 5 * * 1,4'
  workflow_dispatch:
  push:
    paths: ['.github/workflows/calendar.yml']
permissions:
  contents: write
concurrency:
  group: donnees
  cancel-in-progress: false
jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - run: npm install --no-audit --no-fund
      - run: node scripts/calendar.mjs
      - name: Publier si changement
        run: |
          if git diff --quiet; then echo "rien de nouveau"; exit 0; fi
          git config user.name "carnet-bot"; git config user.email "carnet-bot@users.noreply.github.com"
          git commit -am "Auto calendrier $(TZ=Europe/Paris date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done; exit 1
