name: Performances extraNat (chaque jour)
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: donnees
  cancel-in-progress: false
jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - run: npm install --no-audit --no-fund
      - run: node scripts/perfs.mjs
      - name: Publier si changement
        run: |
          if git diff --quiet; then echo "rien de nouveau"; exit 0; fi
          git config user.name "carnet-bot"; git config user.email "carnet-bot@users.noreply.github.com"
          git commit -am "Auto perfs $(TZ=Europe/Paris date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done; exit 1
      - name: Garder les tâches actives (GitHub les suspend après 60 jours sans activité)
        run: |
          git pull -q --rebase || true
          last=$(git log -1 --format=%ct); now=$(date +%s)
          if [ $(( (now-last)/86400 )) -ge 40 ]; then
            git config user.name "carnet-bot"; git config user.email "carnet-bot@users.noreply.github.com"
            git commit --allow-empty -m "Maintien des tâches automatiques" && git push
          fi
