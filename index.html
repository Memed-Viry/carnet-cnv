<style>
/* Layout : appli mobile, une colonne, barre d'onglets en bas ; s'élargit en deux colonnes sur ordinateur. Temps en chasse fixe. */
:root{
  --bg:#eef3f6; --surface:#ffffff; --sunk:#f6f9fb; --ink:#0f2433; --muted:#566b7a; --line:#d3dee6;
  --accent:#0062bd; --accent-soft:#e1eefa; --on-accent:#ffffff; --rope:#cf3426;
  --ok:#1d7f4e; --ok-soft:#e2f3ea; --warn:#a35f00; --warn-soft:#fbefdc;
  --z1:#7fa8c9; --z2:#2f8fd8; --z3:#2aa36b; --z4:#e0a21b; --z5:#d9472f;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:10px; --nav-h:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1620; --surface:#112231; --sunk:#0d1c28; --ink:#e4edf3; --muted:#8fa5b5; --line:#22384a;
  --accent:#4ea4ff; --accent-soft:#16314a; --on-accent:#06121c; --rope:#ff6a58;
  --ok:#4cc98a; --ok-soft:#123326; --warn:#f0b04a; --warn-soft:#3a2a10;
  --z1:#6f93b3; --z2:#3f9be6; --z3:#3cbf82; --z4:#efb43a; --z5:#f0644b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1620; --surface:#112231; --sunk:#0d1c28; --ink:#e4edf3; --muted:#8fa5b5; --line:#22384a;
  --accent:#4ea4ff; --accent-soft:#16314a; --on-accent:#06121c; --rope:#ff6a58;
  --ok:#4cc98a; --ok-soft:#123326; --warn:#f0b04a; --warn-soft:#3a2a10;
  --z1:#6f93b3; --z2:#3f9be6; --z3:#3cbf82; --z4:#efb43a; --z5:#f0644b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);margin:0;-webkit-text-size-adjust:100%}
.wrap{max-width:980px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:0 calc(var(--nav-h) + 24px + env(safe-area-inset-bottom,0px))}
.rope{height:5px;background:repeating-linear-gradient(90deg,#1a7f37 0 22px,var(--surface) 22px 30px,#f5c400 30px 52px,var(--surface) 52px 60px)}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding-block:14px 10px}
h1{font:700 1.8rem/1 var(--f-display);margin:0;letter-spacing:.01em}
h1 small{display:block;font:600 .72rem/1.4 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
h2{font:600 1.4rem/1.1 var(--f-display);margin:0 0 8px;text-wrap:balance}
h3{font:600 1.08rem/1.2 var(--f-display);margin:0 0 8px;letter-spacing:.02em}
.upd{font-size:.72rem;color:var(--muted);text-align:right;line-height:1.3}
.stack{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:820px){.grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.muted{color:var(--muted)} .small{font-size:.86rem}
.t{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
input[type=search]{width:100%;font-size:17px;padding:12px 14px}
button{font:inherit}
.btn{font-weight:600;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);padding:10px 14px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chip-f{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:.9rem;cursor:pointer}
.chip-f[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;text-align:left;cursor:pointer;width:100%}
.item:last-child{border-bottom:0}
.item:active{background:var(--accent-soft)}
.item .nm{font-weight:600;font-size:1.02rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sub{grid-column:1/2;font-size:.82rem;color:var(--muted)}
.item .rt{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.me-tag{font-size:.7rem;font-weight:700;letter-spacing:.06em;color:var(--accent);text-transform:uppercase}
.badge{display:inline-block;font:700 .72rem/1 var(--f-body);letter-spacing:.05em;padding:4px 7px;border-radius:4px;border:1px solid transparent;white-space:nowrap}
.b-n1{background:var(--accent);color:var(--on-accent)}
.b-n2{border-color:var(--accent);color:var(--accent)}
.b-no{color:var(--muted);border-color:var(--line)}
.gap{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}
.kpi .v{font:600 1.35rem/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.kpi .l{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font:600 .7rem var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:var(--sunk)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.tlink{background:none;border:0;padding:4px 0;font:inherit;color:var(--accent);cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}
.ev-group{display:flex;flex-direction:column}
.ev-head{display:flex;justify-content:space-between;align-items:baseline;padding:10px 14px 4px;font:600 1.05rem var(--f-display);letter-spacing:.02em}
.race{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:10px 14px;border:0;border-top:1px solid var(--line);background:none;color:inherit;text-align:left;width:100%;cursor:pointer}
.race:active{background:var(--accent-soft)}
.race .tm{font:600 1.05rem var(--f-mono);font-variant-numeric:tabular-nums;color:var(--accent)}
.race .info{font-size:.84rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.race .pb{font-size:.68rem;font-weight:700;letter-spacing:.05em;color:var(--ok)}
.race .chev{color:var(--muted)}
.zones{display:flex;flex-direction:column;gap:6px}
.zone{display:grid;grid-template-columns:38px minmax(0,1fr) minmax(0,auto) minmax(0,auto);gap:8px;align-items:center;padding:9px 10px;border-radius:8px;background:var(--sunk);border-left:5px solid var(--zc)}
.zone .zn{font:700 1.25rem var(--f-display);color:var(--zc)}
.zone .zt b{display:block;font-weight:600;font-size:.95rem}
.zone .zt span{font-size:.78rem;color:var(--muted)}
.zone .zp{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.86rem;text-align:right}
.zone .zp i{display:block;font-style:normal;font-family:var(--f-body);font-size:.68rem;color:var(--muted)}
@media (max-width:480px){.zone{grid-template-columns:34px minmax(0,1fr) auto}.zone .zp.h{display:none}}
.note{font-size:.84rem;color:var(--muted);border-left:3px solid var(--line);padding-left:10px;margin:0}
.obs{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.obs li{padding:9px 11px;border-radius:8px;background:var(--sunk);font-size:.95rem}
.obs li.w{background:var(--warn-soft)} .obs li.g{background:var(--ok-soft)}
.empty{padding:26px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;color:var(--ink);font:600 1.15rem var(--f-display);margin-bottom:4px}
svg text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend span::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--accent);font-weight:600;padding:6px 0;cursor:pointer}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:600;color:var(--muted)}
.form .wide{grid-column:1/-1}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bottom .in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:560px}
nav.bottom button{background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 10px;font:600 .7rem var(--f-body);letter-spacing:.02em;cursor:pointer;min-height:var(--nav-h)}
nav.bottom button svg{width:24px;height:24px}
nav.bottom button[aria-current="page"]{color:var(--accent)}
.hint{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;font-size:.9rem;display:flex;gap:10px;align-items:flex-start}
.hint button{margin-left:auto;background:none;border:0;color:var(--muted);font-size:1.2rem;line-height:1;cursor:pointer;padding:0 4px}
a{color:var(--accent)}
.sticky-search{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
</style>

function eligible(p,sw,Y=REF_YEAR){const y=+String(p.date).slice(0,4); if(!(y>=Y-3&&y<=Y)) return false; /* AR Maîtres : saisons n-2 à n, du 1er janvier de Y-3 */ if(p.type==='maitres') return true; const c=catOf(sw.annee,y); return p.type==='nc'&&c&&c.k===0}
function qualStatus(sw,ev,season,Y=REF_YEAR){
  const cat=catOf(sw.annee,Y); if(!cat) return null;
  const ps=perfsOf(sw.id).filter(p=>p.ev===ev&&eligible(p,sw,Y)); if(!ps.length) return null;
  const res={level:null,gap1:Infinity,gap2:Infinity,best:null};
  for(const pool of [25,50]){
    const cand=season==='hiver'?ps:ps.filter(p=>+p.pool===pool); if(!cand.length) continue;
    const best=cand.reduce((a,b)=>a.t<=b.t?a:b), gp=season==='hiver'?25:pool;
    const t1=gridT('N1',gp,sw.sexe,ev,cat), t2=gridT('N2',gp,sw.sexe,ev,cat);
    if(t1!=null) res.gap1=Math.min(res.gap1,best.t-t1); if(t2!=null) res.gap2=Math.min(res.gap2,best.t-t2);
    if(!res.best||best.t<res.best.t) res.best=best; if(season==='hiver') break;
  }
  res.level=res.gap1<=0?'N1':res.gap2<=0?'N2':null; return res;
}
function badge(q){
  if(!q) return '<span class="badge b-no">—</span>';
  if(q.level==='N1') return '<span class="badge b-n1">N1</span>';
  if(q.level==='N2') return `<span class="badge b-n2">N2</span>`;
  return isFinite(q.gap2)?`<span class="gap">N2 ${fmtGap(q.gap2)}</span>`:'<span class="badge b-no">—</span>';
}
const gapCell=g=>g<=0?`<span class="badge b-n1">OK ${fmt(-g)}</span>`:`<span class="gap">+${fmt(g)}</span>`;
const SUMM={};
function summary(s){
  if(SUMM[s.id]) return SUMM[s.id];
  const evs=[...new Set(perfsOf(s.id).map(p=>p.ev))]; let n1=0,n2=0;
  for(const e of evs){const a=qualStatus(s,e,'hiver'), b=qualStatus(s,e,'ete'); const lv=[a,b].map(q=>q&&q.level);
    if(lv.includes('N1')) n1++; else if(lv.includes('N2')) n2++;}
  const recent=perfsOf(s.id).filter(p=>p.date>=String(REF_YEAR-3)); const bestPts=recent.reduce((m,p)=>Math.max(m,p.pts||0),0);
  const last=perfsOf(s.id).reduce((m,p)=>p.date>m?p.date:m,'');
  return SUMM[s.id]={n1,n2,bestPts,last,count:perfsOf(s.id).length};
}

/* ---------- CSS / zones ---------- */
function cssFrom(t400,t200){const d=t400-t200; if(!(d>0)) return null; return {pace:d/2, v:200/d}}
function zonesHTML(css,pool){
  const P=css.pace, rng=(z,d)=>{const fast=P*d/100/(z.hi), slow=z.lo?P*d/100/z.lo:null; return slow?`${fmt(fast,1)}–${fmt(slow,1)}`:`&gt; ${fmt(fast,1)}`};
  const rows=[...ZONES].reverse().map(z=>`<div class="zone" style="--zc:var(${z.c})"><div class="zn">Z${z.n}</div>
    <div class="zt"><b>${z.name}</b><span>${z.desc} · ${z.ex}</span></div>
    <div class="zp">${rng(z,100)}<i>/100 m</i></div><div class="zp h">${rng(z,50)}<i>/50 m</i></div></div>`).join('');
  return `<div class="kpis" style="margin-bottom:12px"><div class="kpi"><div class="v">${fmt(P)}</div><div class="l">CSS /100 m</div></div>
    <div class="kpi"><div class="v">${css.v.toFixed(3)}</div><div class="l">m/s</div></div><div class="kpi"><div class="v">${pool||25} m</div><div class="l">Bassin du test</div></div></div>
    <div class="zones">${rows}</div>`;

/* ---------- analyse de course ---------- */
function lapsFrom(r){
  const D=dist(r.ev), n=D/r.lap; if(!Number.isInteger(n)||n<2||!isFinite(r.t)) return null;
  let cum=r.splits.slice(); if(cum.length&&Math.abs(cum[cum.length-1]-r.t)<0.005) cum.pop();
  if(cum.length!==n-1) return {err:`Il faut ${n-1} temps de passage pour un ${D} m (reçu : ${cum.length}).`};
  cum.push(r.t); for(let i=1;i<cum.length;i++) if(cum[i]<=cum[i-1]) return {err:'Les passages doivent être cumulés et croissants.'};
  return {cum,laps:cum.map((c,i)=>c-(i?cum[i-1]:0)),n};
}
function lapChart(laps,lap){
  const W=520,H=200,L=52,B=28,T=12,R=8, max=Math.max(...laps), min=Math.min(...laps), lo=Math.max(0,min-(max-min)*1.2-0.5);
  const bw=(W-L-R)/laps.length, Yp=t=>H-B-(t-lo)/(max-lo)*(H-B-T);
  const avg=laps.slice(1).reduce((a,b)=>a+b,0)/Math.max(1,laps.length-1);
  let g=[lo,(lo+max)/2,max].map(t=>`<line x1="${L}" x2="${W-R}" y1="${Yp(t)}" y2="${Yp(t)}" stroke="var(--line)"/><text x="${L-6}" y="${Yp(t)+4}" text-anchor="end">${fmt(t)}</text>`).join('');
  g+=laps.map((l,i)=>{const x=L+i*bw+bw*.15,w=bw*.7,col=i===0?'var(--z1)':l>avg*1.03?'var(--z5)':l<avg*.98?'var(--z3)':'var(--z2)';
    return `<rect x="${x}" y="${Yp(l)}" width="${w}" height="${H-B-Yp(l)}" rx="3" fill="${col}"></rect>${laps.length<=16?`<text x="${x+w/2}" y="${H-10}" text-anchor="middle">${(i+1)*lap}</text>`:''}`}).join('');
  if(laps.length>2) g+=`<line x1="${L}" x2="${W-R}" y1="${Yp(avg)}" y2="${Yp(avg)}" stroke="var(--ink)" stroke-dasharray="4 4"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block" role="img" aria-label="Temps par fraction">${g}</svg>
  <div class="legend"><span style="--c:var(--z1)">Départ</span><span style="--c:var(--z3)">Plus rapide que la moyenne</span><span style="--c:var(--z5)">Plus lent (&gt; 3 %)</span></div>`;
}
function observations(r,laps,lap,sw){
  const o=[], n=laps.length, D=dist(r.ev), half=Math.floor(n/2);
  const h1=laps.slice(0,half).reduce((a,b)=>a+b,0), h2=laps.slice(n-half).reduce((a,b)=>a+b,0), dif=(h2-h1)/h1*100;
  o.push(`<li>2<sup>e</sup> moitié ${h2>=h1?'plus lente':'plus rapide'} de <b class="t">${fmt(Math.abs(h2-h1))}</b> (${dif>0?'+':''}${dif.toFixed(1)} %).</li>`);
  if(D<=100){
    if(dif<2) o.push('<li class="w">Écart très faible malgré l’avantage du plongeon : départ sans doute trop prudent.</li>');
    else if(dif>10) o.push('<li class="w">Chute marquée en 2<sup>e</sup> partie : départ trop rapide ou tolérance lactique à travailler (50 en Z5).</li>');
    else o.push('<li class="g">Répartition équilibrée pour une course de vitesse (écart attendu de 2 à 10 % avec le plongeon).</li>');
  } else {
    const mid=laps.slice(1,n-1), m=mid.reduce((a,b)=>a+b,0)/mid.length, sd=Math.sqrt(mid.reduce((a,b)=>a+(b-m)**2,0)/mid.length), cv=sd/m*100;
    const dep=(laps[1]-laps[0])/laps[1]*100, fin=(laps[n-1]-m)/m*100;
    const q=Math.max(1,Math.floor(mid.length/2)), a=mid.slice(0,q).reduce((x,y)=>x+y,0)/q, b=mid.slice(-q).reduce((x,y)=>x+y,0)/q, fade=(b-a)/a*100;
    o.push(`<li class="${cv<2.5?'g':cv>4.5?'w':''}">Régularité des fractions centrales : variation de <b>${cv.toFixed(1)} %</b> ${cv<2.5?'(très régulier)':cv>4.5?'(irrégulier : travailler le contrôle d’allure)':''}.</li>`);
    if(dep>12) o.push(`<li class="w">1<sup>er</sup> ${lap} m plus rapide de ${dep.toFixed(0)} % que le 2<sup>e</sup> : départ trop engagé.</li>`);
    if(fade>3) o.push(`<li class="w">Baisse de vitesse progressive de ${fade.toFixed(1)} % : endurance d’allure à renforcer (Z3–Z4).</li>`);
    else if(fade<-1.5) o.push('<li class="g">Accélération en seconde partie : course en négatif split.</li>');
    o.push(`<li class="${fin<0?'g':'w'}">Dernier ${lap} m ${fin<0?'plus rapide':'plus lent'} que la moyenne centrale (${fin>0?'+':''}${fin.toFixed(1)} %)${fin<0?' : bon finish':' : pas de relance finale'}.</li>`);
  }
  if(sw&&r.ev.endsWith('NL')&&D>=200){const css=lastCss(sw),cs=css&&cssFrom(css.t400,css.t200);
    if(cs){const pc=D/r.t/cs.v*100; const ref=D===200?'103–108 %':D===400?'99–103 %':'94–99 %'; o.push(`<li>Vitesse de course à <b>${pc.toFixed(0)} % de la CSS</b>. Repère sur ${D} m : ${ref}.</li>`)}}
  return o;
}
function perfAnalysisHTML(p){
  const sw=S.sw[p.sid]; const D=dist(p.ev), v=D/p.t, yr=+String(p.date).slice(0,4), catR=catOf(sw.annee,yr), catY=catOf(sw.annee);
  const same=perfsOf(sw.id).filter(x=>x.ev===p.ev&&+x.pool===+p.pool).sort((a,b)=>a.t-b.t);

  const chrono=same.slice().sort((a,b)=>a.date<b.date?-1:1), ci=chrono.findIndex(x=>x.id===p.id), prev=ci>0?chrono[ci-1]:null;

  if(prevBest&&p.t<prevBest.t) obs.push(`<li class="g">Record amélioré de <b class="t">${fmt(prevBest.t-p.t)}</b> (ancien : ${fmt(prevBest.t)}, ${fdate(prevBest.date)}).</li>`);
  if(prev){const d=p.t-prev.t; obs.push(`<li class="${d<0?'g':d>0.5?'w':''}">Course précédente (${fdate(prev.date)}, ${fmt(prev.t)}) : <b class="t">${d<0?'−':'+'}${fmt(Math.abs(d))}</b>.</li>`)}
  if(sb&&sb.id!==p.id) obs.push(`<li>Meilleur temps de la saison ${yr} : ${fmt(sb.t)} (${fdate(sb.date)}).</li>`);
  if(other) obs.push(`<li>Meilleur temps en bassin de ${other.pool} m : ${fmt(other.t)} (${fdate(other.date)}).</li>`);

  let grid='';
  if(catY){const rows=['N1','N2'].map(lv=>{const th=gridT(lv,25,sw.sexe,p.ev,catY), te=gridT(lv,+p.pool===50?50:25,sw.sexe,p.ev,catY);
      return `<tr><td><b>${lv}</b></td><td class="num t">${th?fmt(th):'—'}</td><td class="num">${th?gapCell(p.t-th):'—'}</td><td class="num t">${te?fmt(te):'—'}</td><td class="num">${te?gapCell(p.t-te):'—'}</td></tr>`}).join('');
    const el=eligible(p,sw);
    grid=`<div class="tbl-wrap"><table><thead><tr><th>${REF_YEAR} · ${catY.label}</th><th class="num">Hiver</th><th class="num">Écart</th><th class="num">Été ${p.pool} m</th><th class="num">Écart</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="note" style="margin-top:8px">${el?`Cette course compte pour la qualification ${REF_YEAR}.`:`Ne compte pas pour la qualification ${REF_YEAR} (${p.type==='nc'?'compétition hors Maîtres':'hors fenêtre '+(REF_YEAR-2)+'–'+REF_YEAR}).`}</p>`;}
  const L=lapsFrom({ev:p.ev,t:p.t,lap:p.lap||50,splits:(p.splits||[]).slice()});

  if(L&&!L.err){const {laps,cum}=L, lap=p.lap||50, mid=laps.slice(1), avg=mid.length?mid.reduce((a,b)=>a+b,0)/mid.length:laps[0];

      laps.map((l,i)=>{const d=i?((l-avg)/avg*100):null;return `<tr><td>${(i+1)*lap} m</td><td class="num t">${fmt(cum[i])}</td><td class="num t">${fmt(l)}</td><td class="num t">${fmt(l/lap*100)}</td><td class="num gap">${d==null?'départ':(d>0?'+':'')+d.toFixed(1)+' %'}</td></tr>`}).join('')}</tbody></table></div>`;
    if(pb&&pb.id!==p.id&&(pb.splits||[]).length===(p.splits||[]).length){const Lb=lapsFrom({ev:pb.ev,t:pb.t,lap:pb.lap||50,splits:pb.splits.slice()});
      if(Lb&&!Lb.err) lapsHTML+=`<h3 style="margin-top:14px">Comparaison avec le record (${fdate(pb.date)})</h3><div class="tbl-wrap"><table><thead><tr><th></th>${laps.map((_,i)=>`<th class="num">${(i+1)*lap} m</th>`).join('')}</tr></thead><tbody>

    <div class="muted small">${fdate(p.date)}${p.comp?' · '+esc(p.comp):''}${catR?' · '+catR.label+' à l’époque':''}${p.type==='nc'?' · natation course':''}</div>

/* ---------- graphique de progression ---------- */
function progChart(s,ev){
  const ps=perfsOf(s.id).filter(p=>p.ev===ev).sort((a,b)=>a.date<b.date?-1:1); if(ps.length<2) return '<p class="note">Une seule course sur cette épreuve.</p>';
  const c=catOf(s.annee), W=600,H=230,L=58,R=12,T=14,B=30;
  const lines=[]; if(c){const a=gridT('N1',25,s.sexe,ev,c),b=gridT('N2',25,s.sexe,ev,c); if(a)lines.push(['N1',a,'var(--accent)']); if(b)lines.push(['N2',b,'var(--muted)'])}
  const vals=ps.map(p=>p.t); let lo=Math.min(...vals),hi=Math.max(...vals);
  lines.forEach(l=>{if(l[1]>=lo-(hi-lo)*.6&&l[1]<=hi+(hi-lo)*.6){lo=Math.min(lo,l[1]);hi=Math.max(hi,l[1])}});
  const pad=(hi-lo)*.12||1; lo-=pad;hi+=pad;
  const x0=new Date(ps[0].date).getTime(), span=new Date(ps[ps.length-1].date).getTime()-x0||1;
  const X=d=>L+(new Date(d).getTime()-x0)/span*(W-L-R), Yp=t=>T+(t-lo)/(hi-lo)*(H-T-B);
  let g=[0,1,2,3].map(i=>lo+(hi-lo)*i/3).map(t=>`<line x1="${L}" x2="${W-R}" y1="${Yp(t)}" y2="${Yp(t)}" stroke="var(--line)"/><text x="${L-6}" y="${Yp(t)+4}" text-anchor="end">${fmt(t)}</text>`).join('');
  g+=lines.filter(([,t])=>t>=lo&&t<=hi).map(([n,t,col])=>`<line x1="${L}" x2="${W-R}" y1="${Yp(t)}" y2="${Yp(t)}" stroke="${col}" stroke-dasharray="5 4" stroke-width="1.5"/><text x="${W-R}" y="${Yp(t)-5}" text-anchor="end" style="fill:${col}">${n}</text>`).join('');
  for(const pool of [25,50]){const pp=ps.filter(p=>+p.pool===pool); if(pp.length>1) g+=`<polyline fill="none" stroke="${pool===25?'var(--z2)':'var(--z5)'}" stroke-width="2" points="${pp.map(p=>X(p.date)+','+Yp(p.t)).join(' ')}"/>`}
  g+=ps.map(p=>`<circle cx="${X(p.date)}" cy="${Yp(p.t)}" r="4.5" fill="${+p.pool===25?'var(--z2)':'var(--z5)'}" stroke="var(--surface)" stroke-width="1.5"/>`).join('');
  g+=`<text x="${L}" y="${H-8}">${fdate(ps[0].date)}</text><text x="${W-R}" y="${H-8}" text-anchor="end">${fdate(ps[ps.length-1].date)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block" role="img" aria-label="Progression ${EVL[ev]}">${g}</svg>
  <div class="legend"><span style="--c:var(--z2)">Bassin 25 m</span><span style="--c:var(--z5)">Bassin 50 m</span><span style="--c:var(--accent)">Grille N1 hiver ${REF_YEAR}</span></div>`;
}

const RCATS=[['R1',100,119],['R2',120,159],['R3',160,199],['R4',200,239],['R5',240,279],['R6',280,319],['R7',320,359],['R8',360,999]];
const rcatOf=sum=>{const r=RCATS.find(([,a,b])=>sum>=a&&sum<=b);return r?r[0]:null};
function relayCands(sx,stroke,pool,from){return swList().filter(s=>(sx==='X'||s.sexe===sx)&&catOf(s.annee)).map(s=>{const b=bestOf(s.id,'50'+stroke,pool,from);return b?{s,t:b.t,p:b,age:ageAt(s)}:null}).filter(Boolean)}
function bestRelays(kind,gender,pool,from){
  const out={};
  const keep=(sum,legs,total)=>{const rc=rcatOf(sum); if(!rc) return; if(!out[rc]||total<out[rc].total) out[rc]={legs,total,sum}};
  if(kind==='NL'){
    const pick=g=>{const c=relayCands(g,'NL',pool,from).sort((a,b)=>a.t-b.t);return c.slice(0,40)};
    if(gender!=='X'){const c=pick(gender),n=c.length;
      for(let a=0;a<n;a++)for(let b=a+1;b<n;b++)for(let d=b+1;d<n;d++)for(let e=d+1;e<n;e++){const L=[c[a],c[b],c[d],c[e]];keep(L.reduce((x,y)=>x+y.age,0),L,L.reduce((x,y)=>x+y.t,0))}}
    else{const F=pick('F'),M=pick('M'); const pairs=A=>{const r=[];for(let i=0;i<A.length;i++)for(let j=i+1;j<A.length;j++)r.push([A[i],A[j]]);return r};
      for(const f of pairs(F))for(const m of pairs(M)){const L=[...f,...m];keep(L.reduce((x,y)=>x+y.age,0),L,L.reduce((x,y)=>x+y.t,0))}}
  } else {
    const order=['D','B','P','NL'];
    const pool4=g=>{const ids=new Set(), m={}; for(const st of order){for(const c of relayCands(g,st,pool,from).sort((a,b)=>a.t-b.t).slice(0,14)){ids.add(c.s.id);(m[c.s.id]=m[c.s.id]||{s:c.s,age:c.age,t:{}}).t[st]=c}} return Object.values(m)};
    const perms=[[0,1,2,3],[0,1,3,2],[0,2,1,3],[0,2,3,1],[0,3,1,2],[0,3,2,1],[1,0,2,3],[1,0,3,2],[1,2,0,3],[1,2,3,0],[1,3,0,2],[1,3,2,0],[2,0,1,3],[2,0,3,1],[2,1,0,3],[2,1,3,0],[2,3,0,1],[2,3,1,0],[3,0,1,2],[3,0,2,1],[3,1,0,2],[3,1,2,0],[3,2,0,1],[3,2,1,0]];
    const tryQuad=Q=>{const sum=Q.reduce((x,y)=>x+y.age,0); let best=null;
      for(const pm of perms){let tot=0,legs=[];for(let i=0;i<4;i++){const c=Q[pm[i]].t[order[i]];if(!c){tot=Infinity;break}tot+=c.t;legs.push({...c,st:order[i]})}if(tot<(best?best.tot:Infinity))best={tot,legs}}
      if(best) keep(sum,best.legs,best.tot)};
    if(gender!=='X'){const c=pool4(gender),n=c.length;for(let a=0;a<n;a++)for(let b=a+1;b<n;b++)for(let d=b+1;d<n;d++)for(let e=d+1;e<n;e++)tryQuad([c[a],c[b],c[d],c[e]])}
    else{const F=pool4('F'),M=pool4('M');for(let a=0;a<F.length;a++)for(let b=a+1;b<F.length;b++)for(let d=0;d<M.length;d++)for(let e=d+1;e<M.length;e++)tryQuad([F[a],F[b],M[d],M[e]])}
  }
  return out;
}

const IC_EVS=['50NL','100NL','400NL','50D','100D','50B','100B','50P','100P','2004N'];
function hungarianMax(W){ // W: rows (événements) × cols (nageurs), maximise la somme
  const n=W.length,m=W[0].length,N=Math.max(n,m),INF=1e15,C=[];
  for(let i=0;i<N;i++){C.push([]);for(let j=0;j<N;j++)C[i].push(i<n&&j<m?-W[i][j]:0)}
  const u=Array(N+1).fill(0),v=Array(N+1).fill(0),p=Array(N+1).fill(0),way=Array(N+1).fill(0);
  for(let i=1;i<=N;i++){p[0]=i;let j0=0;const minv=Array(N+1).fill(INF),used=Array(N+1).fill(false);
    do{used[j0]=true;const i0=p[j0];let delta=INF,j1=0;for(let j=1;j<=N;j++)if(!used[j]){const cur=C[i0-1][j-1]-u[i0]-v[j];if(cur<minv[j]){minv[j]=cur;way[j]=j0}if(minv[j]<delta){delta=minv[j];j1=j}}
      for(let j=0;j<=N;j++){if(used[j]){u[p[j]]+=delta;v[j]-=delta}else minv[j]-=delta}j0=j1}while(p[j0]!==0);
    do{const j1=way[j0];p[j0]=p[j1];j0=j1}while(j0)}
  const res=Array(n).fill(-1);for(let j=1;j<=N;j++)if(p[j]&&p[j]<=n&&j<=m)res[p[j]-1]=j-1;return res;
}
function icTeam(exclude){
  const sw=swList().filter(s=>catOf(s.annee)&&!exclude.has(s.id)); if(sw.length<10) return null;
  const best=sw.map(s=>IC_EVS.map(ev=>{let b=null;for(const p of perfsOf(s.id)){if(p.ev!==ev||+p.pool!==25||p.date<WIN_FROM||!p.pts)continue;if(!b||p.pts>b.pts)b=p}return b}));
  let bestRes=null;
  for(const lam of [0,40,80,150,250,400,700]){for(const favor of ['F','M']){
    const W=IC_EVS.map((ev,i)=>sw.map((s,j)=>{const b=best[j][i];return (b?b.pts:-5000)+(s.sexe===favor?lam:0)}));
    const a=hungarianMax(W); const team=a.map((j,i)=>({ev:IC_EVS[i],s:sw[j],p:best[j][i]}));
    if(team.some(x=>!x.s)) continue; const nf=team.filter(x=>x.s.sexe==='F').length, nm=10-nf;
    const tot=team.reduce((t,x)=>t+(x.p?x.p.pts:0),0); const ok=nf>=2&&nm>=2&&team.every(x=>x.p);
    if(ok&&(!bestRes||tot>bestRes.tot)) bestRes={team,tot};
    if(lam===0&&ok) break; }}
  return bestRes;
}

/* ---------- Fiche : profil, estimations, forme, objectifs ---------- */
function radarSVG(vals,labels,max){
  const W=300,H=260,cx=150,cy=135,R=95,n=vals.length,pt=(i,r)=>[cx+r*Math.sin(2*Math.PI*i/n),cy-r*Math.cos(2*Math.PI*i/n)];
  let g=[.25,.5,.75,1].map(f=>`<polygon points="${vals.map((_,i)=>pt(i,R*f).join(',')).join(' ')}" fill="none" stroke="var(--line)"/>`).join('');
  g+=vals.map((_,i)=>`<line x1="${cx}" y1="${cy}" x2="${pt(i,R)[0]}" y2="${pt(i,R)[1]}" stroke="var(--line)"/>`).join('');
  g+=`<polygon points="${vals.map((v,i)=>pt(i,R*Math.max(0,v)/max).join(',')).join(' ')}" fill="var(--accent)" fill-opacity=".22" stroke="var(--accent)" stroke-width="2"/>`;
  g+=vals.map((v,i)=>{const [x,y]=pt(i,R+22);return `<text x="${x}" y="${y}" text-anchor="middle" style="font-family:var(--f-body);font-size:12px;fill:var(--ink)">${labels[i]}</text><text x="${x}" y="${y+13}" text-anchor="middle">${v?v:'—'}</text>`}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:340px;display:block;margin:0 auto" role="img" aria-label="Profil par nage">${g}</svg>`;
}
function profileHTML(s){

  const vals=STROKES.map(([k])=>by(k)); const dists=[['Sprint (50)',p=>dist(p.ev)===50],['100 m',p=>dist(p.ev)===100],['200 m et +',p=>dist(p.ev)>=200]].map(([l,f])=>[l,ps.filter(f).reduce((m,p)=>Math.max(m,p.pts),0)]);
  if(!vals.some(Boolean)) return '<p class="note">Pas assez de courses depuis '+(REF_YEAR-2)+' pour établir un profil.</p>';
  const top=STROKES[vals.indexOf(Math.max(...vals))][1];
  const gaps=[]; for(const ev of [...new Set(perfsOf(s.id).map(p=>p.ev))]){for(const se of ['hiver','ete']){const q=qualStatus(s,ev,se); if(!q) continue;
    const [lv,g]=q.level==='N1'?[null,0]:q.level==='N2'?['N1',q.gap1]:['N2',q.gap2]; if(lv&&isFinite(g)) gaps.push({ev,lv,g,rel:g/q.best.t*100,se})}}

  <p class="small" style="margin:6px 0">Meilleurs points FFN depuis ${REF_YEAR-2} par nage. Point fort : <b>${top}</b>. ${dists.map(([l,v])=>`${l} : ${v||'—'}`).join(' · ')}</p>
  ${rec.length?`<h3 style="margin-top:10px">Épreuves les plus proches d’une qualification</h3><ul class="obs">${rec.map(x=>`<li>${EVL[x.ev]} : <b class="t">${fmt(x.g)}</b> à gagner pour la grille ${x.lv} ${x.se==='hiver'?'hiver':'été'} (${x.rel.toFixed(1)} %).</li>`).join('')}</ul>`:''}`;

function estimHTML(s){
  const rows=[]; const pool=25;
  for(const [st,lab] of STROKES){const evs=EVS.map(e=>e[0]).filter(e=>strokeOf(e)===st);
    const known=evs.map(e=>({e,b:bestOf(s.id,e,pool,'2022-01-01')||bestOf(s.id,e,50,'2022-01-01')})).filter(x=>x.b);
    if(!known.length) continue;
    for(const e of evs){ if(known.some(k=>k.e===e)) continue; const D=dist(e);
      const ref=known.slice().sort((a,b)=>Math.abs(Math.log(dist(a.e)/D))-Math.abs(Math.log(dist(b.e)/D)))[0]; const r=dist(ref.e);
      if(D/r>4||r/D>4) continue; const t=ref.b.t*Math.pow(D/r,1.07); rows.push({e,t,from:ref})}}

}

/* ---------- Plan de course (dans l'analyse) ---------- */
function planHTML(p){

  const base=(p.splits||[]).length===D/lap-1?p:own; if(!base) return '';
  const L=lapsFrom({ev:base.ev,t:base.t,lap,splits:base.splits.slice()}); if(!L||L.err) return '';
  const targets=[]; for(const lv of ['N1','N2']){const t=gridT(lv,+p.pool===50?50:25,sw.sexe,p.ev,cat); if(t&&t<p.t) targets.push([lv,t])}

}

const round5=x=>Math.ceil((x-1e-6)/5)*5;
const fmtS=sec=>{const m=Math.floor(sec/60),s=Math.round(sec%60);return m+':'+String(s).padStart(2,'0')};
const SETS={
  z2:{lab:'Endurance (Z2)',z:2,blocks:[[400,20],[300,15],[200,15]]},
  z3:{lab:'Tempo (Z3)',z:3,blocks:[[200,20],[300,20],[100,10]]},
  z4:{lab:'Seuil CSS (Z4)',z:4,blocks:[[100,15],[200,20],[150,15]]},
  z5:{lab:'VO2max (Z5)',z:5,blocks:[[50,30],[100,60],[75,40]]},
  vit:{lab:'Vitesse',z:6,blocks:[[25,45],[50,90]]},
  rec:{lab:'Récupération (Z1)',z:1,blocks:[[200,20],[100,15]]}};
function zonePace(css,z){if(z===6) return css*0.86; const Z=ZONES[z-1]; const mid=z===1?0.80:(Z.lo+Z.hi)/2; return css/mid}
function genSession(css,type,dur,stroke){
  const S0=SETS[type], wu=[{n:1,d:400,txt:'souple, nages au choix',z:1},{n:4,d:50,txt:'éducatifs (rattrapé, 3 temps, poings fermés)',z:1,r:15},{n:4,d:25,txt:'progressif',z:3,r:15}];
  const cd=[{n:1,d:200,txt:'retour au calme souple',z:1}];
  const timeOf=b=>{const pace=zonePace(css,b.z)/100*(b.z===1?1:1); return b.n*(b.d*pace+(b.r||0))};
  let used=[...wu,...cd].reduce((t,b)=>t+timeOf(b),0); const avail=dur*60-used-120;
  const main=[]; let bi=0, left=avail;
  while(left>60&&bi<6){const [d,r]=S0.blocks[bi%S0.blocks.length]; const z=S0.z===6?6:S0.z; const pace=zonePace(css,z)/100*d; const dep=round5(pace+r);
    let n=Math.max(2,Math.min(S0.z>=5?12:10,Math.floor(left/dep*(bi===0?0.6:1)))); if(n*dep>left) n=Math.floor(left/dep); if(n<2) break;
    main.push({n,d,z,pace,dep,txt:`${stroke==='NL'?'crawl':STROKES.find(x=>x[0]===stroke)[1].toLowerCase()} ${S0.lab.toLowerCase()}`}); left-=n*dep+60; bi++;
    if(S0.z===6&&bi>=2) break;}
  const all=[{h:'Échauffement',b:wu},{h:'Série principale',b:main},{h:'Retour au calme',b:cd}];
  const vol=all.reduce((t,g)=>t+g.b.reduce((x,b)=>x+b.n*b.d,0),0);
  return {all,vol,css};
}

/* ================= PERSONNALISATION ================= */
const STROKE_NAME={NL:'nage libre',D:'dos',B:'brasse',P:'papillon','4N':'4 nages'};
const DIST_GROUPS=[['sprint','Sprint (50–100 m)'],['demi','Demi-fond (200–400 m)'],['fond','Fond (800–1500 m)']];
const distGroup=d=>d<=100?'sprint':d<=400?'demi':'fond';
const RECENT=`${REF_YEAR-3}-01-01`;
function autoSpec(s){
  const ps=perfsOf(s.id).filter(p=>p.date>=RECENT&&p.pts);
  const src=ps.length>=3?ps:perfsOf(s.id).filter(p=>p.pts);
  if(!src.length) return {stroke:'NL',dist:'sprint',ev:'50NL',conf:'faible'};
  const byStroke={}, byDist={sprint:[],demi:[],fond:[]}, byEv={};
  for(const p of src){const st=strokeOf(p.ev);(byStroke[st]=byStroke[st]||[]).push(p.pts);byDist[distGroup(dist(p.ev))].push(p.pts);byEv[p.ev]=Math.max(byEv[p.ev]||0,p.pts)}
  const score=a=>{const t=a.sort((x,y)=>y-x).slice(0,3);return t.reduce((x,y)=>x+y,0)/t.length+Math.min(a.length,6)*4};
  const stroke=Object.entries(byStroke).sort((a,b)=>score(b[1])-score(a[1]))[0][0];
  const dg=Object.entries(byDist).filter(([,a])=>a.length).sort((a,b)=>score(b[1])-score(a[1]))[0][0];
  const ev=Object.entries(byEv).filter(([e])=>strokeOf(e)===stroke).sort((a,b)=>b[1]-a[1])[0]?.[0]||'50NL';
  return {stroke,dist:dg,ev,conf:src.length>=8?'bonne':'moyenne'};
}
function getProf(s){
  let o={}; try{o=JSON.parse(ls.get('prof-'+s.id)||'{}')}catch(e){}
  const a=autoSpec(s);
  const nextNat=CAL.find(e=>e.k==='nat'&&e.d&&e.d>=today())||CAL.find(e=>e.d&&e.d>=today());
  return {stroke:o.stroke||a.stroke, dist:o.dist||a.dist, ev:o.ev||a.ev, comp:(o.compT!=null?CAL.findIndex(e=>e.t===o.compT):o.comp)??(nextNat?CAL.indexOf(nextNat):-1), sess:+(o.sess||3), dur:+(o.dur||60), auto:a, custom:!!o.stroke};
}
function saveProf(s,o){if(o.comp!=null) o.compT=o.comp>=0&&CAL[o.comp]?CAL[o.comp].t:null; ls.set('prof-'+s.id,JSON.stringify(o))}

/* ---------- allures personnelles ---------- */
function persoPaces(s,pr){
  const b=(ev)=>bestOf(s.id,ev,25,RECENT)||bestOf(s.id,ev,50,RECENT)||bestOf(s.id,ev,25)||bestOf(s.id,ev,50);
  const st=pr.stroke==='4N'?'NL':pr.stroke;
  const r={}; for(const d of [50,100,200,400]){const x=b(d+st); if(x) r[d]=x.t/d*100}
  // CSS : test > 400/200 NL > estimation
  const c=lastCss(s); let css=null, cssSrc='';
  if(c){const k=cssFrom(c.t400,c.t200); if(k){css=k.pace; cssSrc=`test du ${fdate(c.date)}`}}
  if(!css){const a=b('400NL'),z=b('200NL'); if(a&&z&&a.t>z.t){css=(a.t-z.t)/2; cssSrc='estimée d’après vos 200 et 400 NL'}}
  if(!css){const z=b('200NL'); if(z){css=z.t/2*1.06; cssSrc='estimée d’après votre 200 NL'}}
  if(!css){const z=b('100NL'); if(z){css=z.t*1.16; cssSrc='estimée d’après votre 100 NL'}}
  if(!css){const z=b('50NL'); if(z){css=z.t*2*1.24; cssSrc='estimée d’après votre 50 NL'}}
  if(!css){css=110; cssSrc='valeur par défaut (faites le test CSS)'}
  // allures de course spécialité, extrapolées si manquantes
  const ks=Object.keys(r).map(Number);
  const pace=d=>{if(r[d]) return r[d]; if(!ks.length) return css*(d<=50?0.86:d<=100?0.92:d<=200?0.97:1.0); const d0=ks.slice().sort((x,y)=>Math.abs(Math.log(x/d))-Math.abs(Math.log(y/d)))[0]; return r[d0]*Math.pow(d/d0,0.07)};
  return {css,cssSrc,pace,known:r,st};
}

function persoAnalysisHTML(s){
  const pr=getProf(s), pa=persoPaces(s,pr), cat=catOf(s.annee);

    if(m>10) prio.push(`Fin de course sur 100 ${sname} : 6 × 50 départ 1:15, 2e 25 plus vite que le 1er.`);
    if(m<3) prio.push(`Départ et 1er 50 : 8 × 25 plongé à allure 50 m, récupération complète.`)}
  // tendance
  const yr=y=>{const a=perfsOf(s.id).filter(p=>p.date.startsWith(String(y))&&p.pts&&strokeOf(p.ev)===st).map(p=>p.pts).sort((a,b)=>b-a).slice(0,3);return a.length?a.reduce((x,z)=>x+z,0)/a.length:null};
  const y1=yr(REF_YEAR-1), y0=yr(REF_YEAR-2);
  if(y1&&y0){const d=Math.round(y1-y0); obs.push(`<li class="${d>=0?'g':'w'}">Tendance en ${sname} : ${d>=0?'+':''}${d} pts entre ${REF_YEAR-2} et ${REF_YEAR-1}.</li>`)}
  // objectif

  if(cat&&best){for(const lv of ['N1','N2']){const t=gridT(lv,25,s.sexe,ev,cat); if(!t) continue; const g=best.t-t;
    if(g>0){obs.push(`<li>Objectif ${EVL[ev]} : <b class="t">${fmt(g)}</b> à gagner pour la grille ${lv} hiver (${fmt(t)}), soit ${(g/best.t*100).toFixed(1)} %.</li>`); prio.unshift(`Objectif ${lv} sur ${EVL[ev]} : ${fmt(t)} (−${fmt(g)}). Travail à allure ${fmt(t/dist(ev)*100)} /100.`); break}

}

/* ---------- programme personnalisé ---------- */
function phaseOf(pr){
  const c=CAL[pr.comp]; if(!c||!c.d) return {key:'foncier',lab:'Développement général',weeks:null,comp:null};
  const w=Math.ceil((new Date(c.d+'T12:00:00')-new Date(today()+'T12:00:00'))/(7*864e5));
  if(w<0) return {key:'foncier',lab:'Développement général',weeks:null,comp:null};
  if(w<=1) return {key:'affut',lab:'Affûtage (semaine de compétition)',weeks:w,comp:c};
  if(w<=3) return {key:'affut',lab:'Affûtage',weeks:w,comp:c};
  if(w<=8) return {key:'spec',lab:'Préparation spécifique',weeks:w,comp:c};
  return {key:'foncier',lab:'Développement général (foncier)',weeks:w,comp:c};
}
const SESS_PLAN={
  foncier:['endu','seuil','vitesse','technique','endu2'],
  spec:['allure','seuil','lactique','endu','technique'],
  affut:['allure_c','vitesse','activation','technique','activation']};
const SESS_LAB={endu:'Endurance et technique',endu2:'Endurance longue',seuil:'Seuil (CSS)',vitesse:'Vitesse',technique:'Technique et virages',allure:'Allure de course',lactique:'Tolérance lactique',allure_c:'Allure de course (court)',activation:'Activation pré-compétition'};
function buildSession(type,pr,pa,dur){
  const st=pr.stroke, sn=st==='4N'?'4 nages':STROKE_NAME[st], css=pa.css, spDist=pr.dist==='sprint'?100:pr.dist==='demi'?200:400;
  const rp=d=>pa.pace(d); // allure /100 de course dans la nage de spécialité
  const B=[]; const add=(n,d,txt,pace,rest,z)=>{const t=pace?pace/100*d:null; B.push({n,d,txt,t,dep:t?round5(t+rest):null,rest,z})};
  // échauffement
  add(1,300,'souple, nages variées',null,0,1); add(4,50,`éducatifs ${sn} : ${TECH[st][0].split(' : ')[0].toLowerCase()}`,null,15,1); add(4,25,'progressif',css*0.95,20,3);
  const vol0=B.reduce((t,b)=>t+b.n*b.d,0);
  const main=[];
  const M=(n,d,txt,pace,rest,z)=>main.push({n,d,txt,pace,rest,z});
  switch(type){
    case 'endu': M(4,200,`crawl régulier, respiration 3 temps`,css/0.885,20,2); M(8,50,`${sn} technique : ${TECH[st][1].split(' : ')[0].toLowerCase()}`,null,15,1); M(4,100,`${sn} aisance`,rp(200)*1.08,20,2); break;
    case 'endu2': M(1,800,'crawl continu, allure régulière',css/0.88,0,2); M(6,100,`${sn} allure 400`,rp(400)*1.03,20,3); break;
    case 'seuil': M(10,100,'crawl allure CSS',css,15,4); M(4,50,`${sn} allure 200`,rp(200),25,4); break;
    case 'vitesse': M(4,100,'crawl souple, mise en route',css/0.86,20,2); M(8,25,`${sn} sprint max, départ plongé ou poussée forte`,rp(50)*0.97,40,6); M(4,50,`${sn} 25 vite / 25 souple`,null,30,3); M(4,100,'crawl récupération active',css/0.85,20,1); break;
    case 'technique': M(8,50,`${sn} éducatifs (voir liste)`,null,20,1); M(6,25,'virages + coulées, sortie de virage rapide',null,30,3); M(4,100,`${sn} nage complète, amplitude`,rp(200)*1.1,20,2); break;
    case 'allure': M(spDist<=100?6:5,spDist<=100?50:100,`${sn} allure de course ${spDist} m`,rp(spDist),spDist<=100?40:30,5); M(4,100,'crawl allure CSS',css,15,4); break;
    case 'lactique': M(spDist<=100?6:4,spDist<=100?50:100,`${sn} à fond, récupération longue`,rp(spDist<=100?100:200)*0.99,spDist<=100?75:120,6); M(1,200,'souple entre les séries',null,0,1); M(4,25,`${sn} sprint`,rp(50),35,6); break;
    case 'allure_c': M(4,spDist<=100?25:50,`${sn} allure de course ${spDist} m`,rp(spDist),45,5); M(2,spDist<=100?50:100,`${sn} allure course, relâché`,rp(spDist)*1.01,60,5); break;
    case 'activation': M(4,25,`${sn} départs plongés`,rp(50),45,6); M(2,50,`${sn} allure course`,rp(spDist),60,5); break;
  }
  // ajuster le volume à la durée : coefficient appliqué au nombre de répétitions du 1er bloc
  const timeOf=b=>b.n*((b.pace?b.pace/100*b.d:css*1.15/100*b.d)+b.rest);
  const cd=200*css*1.2/100, wu=B.reduce((t,b)=>t+b.n*((b.t||css*1.2/100*b.d)+b.rest),0);
  const avail=dur*60-wu-cd-120; let tot=main.reduce((t,b)=>t+timeOf(b),0);
  if(main.length&&tot>0){const f=avail/tot; if(type!=='activation'&&type!=='allure_c') main.forEach(b=>{if(b.n>1) b.n=Math.max(2,Math.round(b.n*Math.min(1.4,Math.max(0.5,f))))})}
  for(const b of main) add(b.n,b.d,b.txt,b.pace,b.rest,b.z);

}

/* ---------- calculs nutrition ---------- */
function nutriCalc(s,b){
  const pr=getProf(s), age=ageOf(s), kg=b.kg, cm=b.cm, M=s.sexe==='M';
  const bmr=10*kg+6.25*cm-5*age+(M?5:-161);
  const imc=kg/((cm/100)**2);
  const base=bmr*(+b.job||1.3);
  const swimH=pr.dur/60, swimKcal=(7-1)*kg*swimH;            // natation Maîtres ≈ 7 MET, dépense nette
  const muKcal=(5-1)*kg*(getMu(s).dur/60);
  let goal=b.goal||'perf', blocked=false;
  if(goal==='perte'&&imc<20){goal='perf';blocked=true}
  const adj=goal==='perte'?0.85:goal==='muscle'?1.08:1;
  const floor=bmr*1.15;
  const day=(extra,hard)=>{const kcal=Math.max(floor,(base+extra)*adj);
    const P=(goal==='perf'?1.6:1.8)*kg;
    const C=(hard==='comp'?6:hard==='rest'?3:pr.dur>=90?6:pr.dur>=75?5:4.5)*kg*(goal==='perte'&&hard!=='comp'?0.85:1);
    let F=(kcal-P*4-C*4)/9; const Fmin=Math.max(0.8*kg,kcal*0.2/9); if(F<Fmin)F=Fmin;
    return {kcal:Math.round(P*4+C*4+F*9),P:Math.round(P),C:Math.round(C),F:Math.round(F)}};
  return {bmr:Math.round(bmr),imc,goal,blocked,age,
    train:day(swimKcal,'train'), rest:day(b.mu?muKcal*0.5:0,'rest'), comp:day(swimKcal*0.6,'comp'),
    water:Math.round(kg*35/50)*50, waterSes:Math.round((pr.dur/60)*600/50)*50, pr};
}
/* aliments : kcal, protéines, glucides, lipides pour 100 g */
const FOOD={
  avoine:['flocons d’avoine',370,13,60,7], pain:['pain complet',250,9,45,3], pates:['pâtes (poids cuit)',150,5.5,30,0.9], riz:['riz (poids cuit)',130,2.7,28,0.3],
  pdt:['pommes de terre',85,2,19,0.1], banane:['banane',90,1.1,21,0.3], fruit:['fruit de saison',52,0.4,12,0.2], miel:['miel ou confiture',300,0,75,0],
  lait:['lait demi-écrémé',46,3.3,4.8,1.6], soja:['boisson soja',40,3.3,2.5,1.8], skyr:['skyr nature',60,10.5,4,0.2], ysoja:['yaourt soja',50,4,2,2.5],
  fblanc:['fromage blanc 3 %',75,7.5,4,3], oeuf:['œufs',140,12.5,0.7,9.5], poulet:['poulet ou dinde (cuit)',165,31,0,3.6], poisson:['poisson blanc (cuit)',105,23,0,1],
  saumon:['saumon (cuit)',200,22,0,12], lentilles:['lentilles ou pois chiches (cuits)',115,9,17,0.4], tofu:['tofu ferme',120,12,2,7],
  legumes:['légumes',30,1.5,5,0.3], huile:['huile d’olive ou de colza',900,0,0,100], amandes:['amandes ou noix',600,21,7,52]};
function protSrc(diet,meal){
  const m={omni:{dej:'poulet',din:'poisson',pd:'skyr',col:'fblanc'},sansporc:{dej:'poulet',din:'poisson',pd:'skyr',col:'fblanc'},
    pesco:{dej:'poisson',din:'saumon',pd:'skyr',col:'fblanc'},vege:{dej:'oeuf',din:'tofu',pd:'skyr',col:'fblanc'},vegan:{dej:'tofu',din:'lentilles',pd:'ysoja',col:'ysoja'}};
  return (m[diet]||m.omni)[meal]}
function planMeals(t,diet){
  const milk=diet==='vegan'?'soja':'lait';
  const M=[
    {k:'pd',lab:'Petit-déjeuner',pc:.22,cc:.25,fix:[[milk,250],['banane',120]],carb:'avoine',fat:'amandes'},
    {k:'dej',lab:'Déjeuner',pc:.30,cc:.28,fix:[['legumes',200],['fruit',150]],carb:'pates',fat:'huile'},
    {k:'col',lab:'Collation (avant ou après la séance)',pc:.15,cc:.17,fix:t.C/t.P>2.6?[['miel',20]]:[],carb:'pain',fat:null},
    {k:'din',lab:'Dîner',pc:.33,cc:.30,fix:[['legumes',250]],carb:'riz',fat:'huile'}];
  const out=[], tot=[0,0,0,0];
  for(const m of M){
    const items=m.fix.map(([f,g])=>[f,g]); const sum=i=>items.reduce((t,[f,g])=>t+FOOD[f][i]*g/100,0);
    const cNeed=t.C*m.cc-sum(3); items.push([m.carb,r10(Math.max(m.carb==='avoine'?30:40,cNeed/(FOOD[m.carb][3]/100)))]);
    const ps=protSrc(diet,m.k); const pNeed=t.P*m.pc-sum(2); let pg=r10(Math.max(m.k==='col'?80:60,pNeed/(FOOD[ps][2]/100)));
    if(ps==='oeuf') pg=Math.max(120,Math.round(pg/60)*60); items.push([ps,pg]);
    if(m.fat){const fNeed=t.F*(m.k==='pd'?.2:.3)-sum(4); if(fNeed>2) items.push([m.fat,r5(fNeed/(FOOD[m.fat][4]/100))])}
    const kc=sum(1),P=sum(2),C=sum(3),F=sum(4); tot[0]+=kc;tot[1]+=P;tot[2]+=C;tot[3]+=F;
    out.push({lab:m.lab,items:items.filter(([,g])=>g>0),kc,P,C,F});
  }
  // ajuster les féculents si les glucides dépassent la cible
  const CARBS=['avoine','pates','riz','pain'], tc=()=>out.reduce((t,m)=>t+m.items.reduce((u,[f,g])=>u+FOOD[f][3]*g/100,0),0);
  for(let it=0;it<4&&tc()>t.C*1.04;it++){const ex=tc()-t.C; const cs=out.flatMap(m=>m.items.filter(x=>CARBS.includes(x[0])&&x[1]>20)); const cap=cs.reduce((u,x)=>u+FOOD[x[0]][3]*(x[1]-20)/100,0); if(cap<=0) break;
    const k=Math.min(1,ex/cap); cs.forEach(x=>{x[1]=Math.max(20,r10(x[1]-(x[1]-20)*k))})}
  for(const m of out){const sm=i=>m.items.reduce((u,[f,g])=>u+FOOD[f][i]*g/100,0); m.kc=sm(1);m.P=sm(2);m.C=sm(3);m.F=sm(4)}
  tot[0]=out.reduce((u,m)=>u+m.kc,0);tot[1]=out.reduce((u,m)=>u+m.P,0);tot[2]=out.reduce((u,m)=>u+m.C,0);tot[3]=out.reduce((u,m)=>u+m.F,0);
  // compléter les lipides restants en huile au dîner
  const fGap=t.F-tot[3]; if(fGap>4){const d=out[3],it=d.items.find(x=>x[0]==='huile'); const add=r5(fGap); if(it) it[1]+=add; else d.items.push(['huile',add]); tot[0]+=add*9; tot[3]+=add; d.kc+=add*9; d.F+=add}
  return {meals:out,tot};
}

  }
  const dose=k=>{const e=EXO[k], expl=['squat_jump','slam','squat_lent'].includes(k), iso=['planche','lateral'].includes(k), deb=mu.lvl==='deb', conf=mu.lvl==='conf';
    let sets=ph.key==='affut'?2:ph.key==='spec'?(expl?4:3):3; if(deb) sets=Math.max(2,sets-1); if(conf&&ph.key!=='affut') sets++;
    if(e.cat==='prev'||e.cat==='mob') return {s:2,r:e.cat==='mob'?'8 par côté':'12–15 lents',rec:'30 s'};
    if(iso) return {s:sets,r:ph.key==='spec'?'20–30 s':deb?'20–30 s':'30–45 s',rec:'30 s'};
    if(ph.key==='spec') return expl?{s:sets,r:'5 explosifs',rec:'90 s'}:{s:sets,r:'6–8, montée rapide',rec:'90 s'};
    if(ph.key==='affut') return expl?{s:2,r:'3 explosifs',rec:'2 min'}:{s:2,r:'6',rec:'90 s'};
    return {s:sets,r:pr.dist==='fond'?'15':'10–12',rec:'45–60 s'}};
  return {sessions,ph,mu,old,dose};
}
function viewMuscu(id){
  const s=S.sw[id]; if(!s){go('nageurs');return}
  const pr=getProf(s), M=buildMuscu(s), mu=M.mu, ph=M.ph;
  const phTxt=ph.key==='foncier'?'Force et endurance de force : mouvements contrôlés, 2 s à la descente.':ph.key==='spec'?'Puissance : mouvements explosifs, peu de répétitions, récupération complète.':'Entretien : volume divisé par deux, dernière séance au plus tard 5 jours avant la compétition.';
  $('#view').innerHTML=`<button class="back" data-go="forme-${id}">‹ Forme</button><div class="stack">
  <div class="panel"><div class="muted small" style="text-transform:uppercase;letter-spacing:.07em;font-weight:600">Musculation spécifique natation</div>
    <h2 style="margin:2px 0 6px">${esc(s.prenom)} · ${STROKE_NAME[pr.stroke]}</h2>
    <div class="kpis"><div class="kpi"><div class="v">${mu.n}</div><div class="l">Séances / sem.</div></div><div class="kpi"><div class="v">${mu.dur} min</div><div class="l">Par séance</div></div><div class="kpi"><div class="v">${M.sessions[0]?M.sessions[0].length:0}</div><div class="l">Exercices</div></div></div>
    <div class="hint" style="margin-top:12px"><span><b>${ph.lab}</b>${ph.comp?` vers « ${esc(ph.comp.t)} »`:''}. ${phTxt}${M.old?' Sans sauts (60 ans et plus) : versions sans impact.':''}</span></div>
    <details style="margin-top:12px"${ls.get('mu-'+id)?'':' open'}><summary style="cursor:pointer;font-weight:600;color:var(--accent)">Personnaliser (matériel, niveau, zones sensibles)</summary>
      <div class="form" style="margin-top:10px">
        <div class="wide"><div class="small muted" style="font-weight:600;margin-bottom:4px">Matériel disponible (poids du corps toujours inclus)</div><div class="row">${EQ_LAB.map(([k,l])=>`<label class="chip-f" style="display:inline-flex;gap:6px;align-items:center"><input type="checkbox" data-eq="${k}"${mu.eq.includes(k)?' checked':''} style="padding:0;width:auto"> ${l}</label>`).join('')}</div></div>
        <label for="m_l">Niveau${selHTML('m_l',[['deb','Débutant'],['inter','Intermédiaire'],['conf','Confirmé']],mu.lvl,'Niveau')}</label>
        <label for="m_n">Séances / semaine${selHTML('m_n',[[1,'1'],[2,'2'],[3,'3']],mu.n,'Séances')}</label>
        <label for="m_d">Durée${selHTML('m_d',[[20,'20 min'],[30,'30 min'],[45,'45 min']],mu.dur,'Durée')}</label>
        <div class="wide"><div class="small muted" style="font-weight:600;margin-bottom:4px">Zones sensibles à ménager</div><div class="row">${[['epaule','Épaules'],['genou','Genoux'],['dos','Bas du dos']].map(([k,l])=>`<label class="chip-f" style="display:inline-flex;gap:6px;align-items:center"><input type="checkbox" data-se="${k}"${mu.sens.includes(k)?' checked':''} style="padding:0;width:auto"> ${l}</label>`).join('')}</div></div>
        <div class="wide row"><button class="btn" id="m_ok">Mettre à jour mon programme</button></div></div></details></div>
  <div class="panel"><h3>Échauffement (5 min)</h3><ul class="obs"><li>Moulinets de bras avant et arrière, 20 de chaque.</li><li>Rotations externes à l’élastique très léger, 15.</li><li>10 squats lents et 10 fentes alternées sans charge.</li></ul></div>
  ${M.sessions.map((L,i)=>`<div class="panel"><h3>Séance ${String.fromCharCode(65+i)}${M.sessions.length>1?` · ${['lundi ou mardi','jeudi','samedi'][i]||''}`:''}</h3><div class="stack" style="gap:12px">
    ${L.map((k,j)=>{const e=EXO[k],d=M.dose(k);return `<div style="background:var(--sunk);border-radius:10px;padding:10px 12px">
      <span class="muted small">${j+1}. ${CAT_LAB[e.cat]}</span><div style="font-weight:600">${e.n}</div><div class="small" style="margin-top:2px"><b class="t">${d.s} × ${d.r}</b> <span class="muted">· récupération ${d.rec}</span></div>
      ${exoSVG(k)}
      <ol class="small" style="margin:4px 0 0;padding-left:18px">${e.cue.map(c=>`<li>${c}</li>`).join('')}</ol>
      <p class="small muted" style="margin:6px 0 0">${e.why}</p></div>`}).join('')}</div></div>`).join('')}
  <p class="note">Faites ces séances hors des jours de séance d’eau intense, ou après la natation. Arrêtez un exercice en cas de douleur, en particulier à l’épaule. En cas de blessure ou de problème de santé, demandez l’avis d’un médecin ou d’un kiné.</p></div>`;
  $('#m_ok').onclick=()=>{const eq=[...document.querySelectorAll('[data-eq]')].filter(x=>x.checked).map(x=>x.dataset.eq), sens=[...document.querySelectorAll('[data-se]')].filter(x=>x.checked).map(x=>x.dataset.se);
    ls.set('mu-'+id,JSON.stringify({eq,sens,lvl:$('#m_l').value,n:+$('#m_n').value,dur:+$('#m_d').value})); viewMuscu(id); window.scrollTo(0,0)};
  wire();
}

/* ---------- onglet Forme ---------- */
function viewForme(id){
  id=id||me(); const s=id?S.sw[id]:null;
  if(!s){$('#view').innerHTML=`<div class="stack"><div class="panel"><h2>Forme hors de l’eau</h2><p>Nutrition et musculation personnalisées selon votre corps, votre nage et vos compétitions.</p>
    <div class="hint"><span>Ouvrez votre fiche dans <b>Nageurs</b> et touchez « C’est moi » : cet onglet s’ouvrira directement sur votre programme.</span></div>
    <div class="row" style="margin-top:12px"><button class="btn" data-go="nageurs">Trouver mon nom</button></div></div></div>`; wire(); return}
  const b=getBody(s), pr=getProf(s), mu=getMu(s), n=b?nutriCalc(s,b):null;
  $('#view').innerHTML=`${id!==me()?`<button class="back" data-go="s${id}">‹ ${esc(swName(s))}</button>`:''}<div class="stack">
  <div class="panel"><div class="muted small" style="text-transform:uppercase;letter-spacing:.07em;font-weight:600">Forme hors de l’eau</div><h2 style="margin:2px 0 6px">${esc(s.prenom)} ${esc(s.nom)}</h2>
    <p class="small muted" style="margin:0">${STROKE_NAME[pr.stroke]} · ${pr.sess} séances de natation par semaine · ${phaseOf(pr).lab.toLowerCase()}</p></div>
  <div class="panel"><h3>Nutrition</h3>${n?`<div class="kpis"><div class="kpi"><div class="v">${b.kg} kg</div><div class="l">Poids · IMC ${n.imc.toFixed(1)}</div></div><div class="kpi"><div class="v">${n.train.kcal}</div><div class="l">kcal jour d’entraînement</div></div><div class="kpi"><div class="v">${n.train.P} g</div><div class="l">Protéines / jour</div></div></div>
      <div class="row" style="margin-top:12px"><button class="btn" data-go="nutri-${id}">Mon plan alimentaire</button><button class="btn ghost" id="f_w">Noter mon poids du jour</button></div><div id="f_wbox"></div>`
    :`<p class="small" style="margin-top:0">Indiquez votre poids et votre taille : l’appli calcule vos besoins et vous propose des repas avec les portions.</p><button class="btn" data-go="corps-${id}">Renseigner mes mesures</button>`}</div>
  <div class="panel"><h3>Musculation spécifique natation</h3><p class="small" style="margin-top:0">${mu.n} séance${mu.n>1?'s':''} de ${mu.dur} min, illustrées, adaptées à votre nage (${STROKE_NAME[pr.stroke]}), votre matériel et la période de la saison.</p>
    <div class="row">${['rot_ext','lat_band','squat_jump'].map(k=>`<div style="flex:1 1 140px;min-width:0">${exoSVG(k)}</div>`).join('')}</div>
    <button class="btn" data-go="muscu-${id}" style="margin-top:10px">Mon programme de musculation</button></div>
  <p class="note">Vos mesures et réglages restent sur ce téléphone uniquement.</p></div>`;
  const fw=$('#f_w'); if(fw) fw.onclick=()=>{$('#f_wbox').innerHTML=`<div class="row" style="margin-top:10px"><input id="f_kg" inputmode="decimal" placeholder="kg" style="width:100px"><button class="btn" id="f_ok">Enregistrer</button></div>`;
    $('#f_ok').onclick=()=>{const kg=num($('#f_kg').value); if(!(kg>=35&&kg<=200)) return; const o=getBody(s); const log=(o.log||[]).filter(x=>x.d!==today()); log.push({d:today(),kg}); log.sort((a,c)=>a.d<c.d?-1:1); o.kg=kg; o.log=log.slice(-60); saveBody(s,o); viewForme(id)}};
  wire();
}


/* ---------- installation (PWA) ---------- */
let deferredPrompt=null; window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.querySelectorAll('[data-install]').forEach(b=>b.hidden=false)});
const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function installHTML(){
  if(isStandalone()) return '';
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  return `<div class="hint" id="instHint"><span><b>Installer l’application</b> : ${ios?'dans Safari, touchez le bouton Partager <span aria-hidden="true">⬆︎</span> puis « Sur l’écran d’accueil ».':'touchez « Installer » ci-contre, ou menu ⋮ du navigateur › « Installer l’application » / « Ajouter à l’écran d’accueil ».'}</span>${ios?'':`<button class="btn" data-install hidden style="font-size:.85rem;padding:6px 10px;margin-left:auto">Installer</button>`}</div>`;
}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-install]'); if(!b||!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; document.querySelectorAll('[data-install]').forEach(x=>x.hidden=true)});
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

/* ---------- navigation ---------- */
function route(tok){
  tok=tok||'nageurs'; let tab=tok;
  if(tok.startsWith('s')&&S.sw[tok.slice(1)]){viewFiche(tok.slice(1)); tab=tok.slice(1)===me()?'moi':'nageurs'}
  else if(tok.startsWith('p')&&S.perfs[tok.slice(1)]){viewPerf(tok.slice(1)); tab=S.perfs[tok.slice(1)].sid===me()?'moi':'nageurs'}
  else if(tok==='moi') viewMoi(); else if(tok==='zones'){viewZones(); tab='entr'} else if(tok==='entr') viewEntr(); else if(tok==='grilles'){viewClub('grilles'); tab='club'}
  else if(tok==='club'||tok.startsWith('club-')){viewClub(tok.slice(5)); tab='club'}
  else if(tok.startsWith('cmp-')){viewCmp(tok.slice(4)); tab='nageurs'}
  else if(tok.startsWith('prog-')){viewProg(tok.slice(5)); tab=tok.slice(5)===me()?'entr':'nageurs'}
  else if(tok.startsWith('prof-')){viewProf(tok.slice(5)); tab=tok.slice(5)===me()?'entr':'nageurs'}
  else if(tok==='forme'){viewForme(); tab='forme'}
  else if(tok.startsWith('forme-')){viewForme(tok.slice(6)); tab=tok.slice(6)===me()?'forme':'nageurs'}
  else if(tok.startsWith('corps-')){viewCorps(tok.slice(6)); tab=tok.slice(6)===me()?'forme':'nageurs'}
  else if(tok.startsWith('nutri-')){viewNutri(tok.slice(6)); tab=tok.slice(6)===me()?'forme':'nageurs'}
  else if(tok.startsWith('muscu-')){viewMuscu(tok.slice(6)); tab=tok.slice(6)===me()?'forme':'nageurs'}
  else {viewNageurs(); tab='nageurs'}
  document.querySelectorAll('nav.bottom [data-go]').forEach(b=>b.setAttribute('aria-current',b.dataset.go===tab?'page':'false'));
}
const hist=[];
function go(tok){ hist.push(tok); route(tok); window.scrollTo(0,0); try{history.pushState({tok},'')}catch(e){} }
window.addEventListener('popstate',e=>{const t=e.state&&e.state.tok; route(t||'nageurs')});
document.querySelectorAll('nav.bottom [data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
$('#updDate').textContent=fdate(DATA.maj);
const start=(location.hash||'').slice(1);
try{history.replaceState({tok:start||(me()?'moi':'nageurs')},'')}catch(e){}
route(start||(me()?'moi':'nageurs'));
</script>
